<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhodex Uzbekistan</title>
<meta name="robots" content="noindex">
<script>
/* GitHub Pages shows this file for any address that no longer exists.
   Old-site links (Google results, ads, Instagram, QR codes) are forwarded
   to the matching new page instead of a dead "404".
   Add more old product numbers to OLD as you find them in Search Console. */
(function(){
  var OLD = {
    'product01':'luminar-facial-soap',
    'product04':'white-mask',
    'product08':'blanc-finish-cover-pact',
    'product19':'lucent-complexion-cream'
  };
  var lang = 'uz';
  try { if (localStorage.getItem('rhodex-lang') === 'ru') lang = 'ru'; } catch(e){}
  if (/^\/ru(\/|$)/.test(location.pathname)) lang = 'ru';
  var list = lang === 'ru' ? '/ru/produkty' : '/uz/mahsulotlar';
  var one  = lang === 'ru' ? '/ru/produkt?p=' : '/uz/mahsulot?p=';
  var m = /(product\d+)/i.exec(location.pathname);
  var dest = (m && OLD[m[1].toLowerCase()]) ? one + OLD[m[1].toLowerCase()] : list;
  location.replace(dest + (location.search && !m ? location.search : ''));
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/icons/site.webmanifest">
<meta name="theme-color" content="#5b4170">
</head>
<body style="font-family:sans-serif;text-align:center;padding:60px 20px">
<p><a href="/uz/mahsulotlar">Mahsulotlar</a> · <a href="/ru/produkty">Продукты</a></p>
</body>
</html>
