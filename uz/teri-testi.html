<style>
:root{
  --plum:#5b4170;
  --lilac:#efe9f4;
  --orchid:#c8a2c8;
  --cream:#f8f5ef;
  --ink:#33293c;
  --ink-soft:#6a6072;
  --gold:#b89b6a;
  --violet:#e2cbf6;
  --rule:#d8cce2;
  --white:#fff;
  --sans:'Jost',-apple-system,'Segoe UI',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── shell ─────────────────────────────────────────── */

.q-head{max-width:520px;margin:0 auto;padding:26px 20px 0;text-align:center}
.q-head h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:0;color:var(--plum);letter-spacing:.3px}
.q-bar{height:2px;background:var(--rule);max-width:520px;margin:20px auto 0;position:relative}
.q-bar span{position:absolute;left:0;top:0;height:100%;background:var(--gold);width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

.wrap{max-width:520px;margin:0 auto;padding:22px 20px 72px}

/* ── option cards ──────────────────────────────────── */
.step-n{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:10px}
.q-ask{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.3;margin:0 0 18px;color:var(--ink)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:9px;cursor:pointer;font-family:var(--sans);font-size:16px;font-weight:400;line-height:1.4;color:var(--ink);transition:border-color .18s,background .18s}
.opt:hover{border-color:var(--orchid);background:var(--lilac)}
.opt:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.opt.on{background:var(--lilac);border-color:var(--plum)}
.opt img{width:54px;height:54px;flex-shrink:0;object-fit:contain;border-radius:8px;background:var(--cream)}
.opt .lbl{flex:1}
.tick{width:20px;height:20px;border-radius:4px;flex-shrink:0;border:1.5px solid var(--rule);background:var(--white);display:flex;align-items:center;justify-content:center}
.opt.on .tick{border-color:var(--plum);background:var(--plum)}
.tick svg{width:11px;height:11px;display:none}
.opt.on .tick svg{display:block}

.btn{display:block;width:100%;background:var(--plum);color:var(--white);border:none;border-radius:8px;padding:14px;font-family:var(--sans);font-size:17px;font-weight:500;letter-spacing:.3px;cursor:pointer;transition:background .18s}
.btn:hover{background:#4a3460}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn-ghost{background:none;border:none;color:var(--ink-soft);font-family:var(--sans);font-size:15px;padding:8px 2px;cursor:pointer;margin-top:6px}
.btn-ghost:hover{color:var(--plum)}
.btn-line{display:block;width:100%;background:none;border:1px solid var(--rule);border-radius:8px;padding:12px;font-family:var(--sans);font-size:15px;color:var(--ink-soft);cursor:pointer}
.btn-line:hover{border-color:var(--orchid);color:var(--plum)}
.hint{font-size:14px;color:var(--ink-soft);text-align:center;margin:8px 0 0}

/* ── result blocks ─────────────────────────────────── */
.band{display:inline-block;background:var(--plum);color:var(--white);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;font-weight:500;padding:5px 12px;border-radius:3px}
.res-name{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--plum);margin:12px 0 2px;line-height:1.1}
.res-sub{font-size:15px;color:var(--ink-soft);margin:0}
.chip{display:inline-block;border:1px solid var(--plum);color:var(--plum);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;margin:10px 6px 0 0}
.chip.soft{border-color:var(--rule);color:var(--ink-soft)}

.sec{margin-top:30px}
.sec-h{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--plum);font-weight:600;padding-bottom:7px;border-bottom:1px solid var(--gold);margin-bottom:14px}
.card{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:10px}
.card h3{font-family:var(--sans);font-size:16px;font-weight:600;margin:0 0 7px;color:var(--ink)}
.card p{font-size:16px;color:var(--ink-soft);margin:0;line-height:1.65}
.card p+p{margin-top:9px}

/* axis */
.axis{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:18px 16px 14px}
.axis+.axis{margin-top:9px}
.axis-lbl{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:12px}
.track{position:relative;height:3px;background:var(--lilac);border-radius:2px;margin:0 8px}
.mark{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:var(--plum);border:3px solid var(--white);box-shadow:0 0 0 1px var(--plum);transform:translate(-50%,-50%)}
.mark.two{background:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mark-cap{position:absolute;top:16px;font-size:12.5px;letter-spacing:.8px;color:var(--ink-soft);white-space:nowrap;transform:translateX(-50%)}
.axis-note{font-size:14px;color:var(--ink-soft);margin:26px 0 0;line-height:1.5}

/* protocol */
.step{display:flex;gap:14px;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:9px}
.step-i{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--gold);line-height:1;padding-top:2px;min-width:20px}
.step-b{flex:1}
.step-b h4{font-family:var(--sans);font-size:16px;font-weight:600;margin:0 0 3px;color:var(--plum)}
.step-b p{font-size:15px;color:var(--ink-soft);margin:0;line-height:1.55}
.kfda{display:inline-block;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:5px}

/* proof */
.proof{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px}
.proof{margin-bottom:12px}
.proof-img{position:relative;margin-bottom:10px}
.proof-img img{width:100%;height:auto;display:block;border-radius:8px}
.pr-split{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff}
.pr-ba{position:absolute;bottom:10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:#fff;background:rgba(43,34,51,.72);padding:4px 11px;border-radius:20px}
.pr-ba.b{left:10px}.pr-ba.a{right:10px}
.proof-all{display:inline-block;margin-top:12px;font-size:15px;color:var(--plum);text-decoration:none;border-bottom:1px solid var(--orchid);padding-bottom:2px}
.p-link{color:var(--plum);text-decoration:none}
.p-link:hover{text-decoration:underline}
.proof-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.proof-ph{aspect-ratio:3/4;background:var(--lilac);border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--plum);font-weight:500}
.proof-meta{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.5}

/* cta */
.cta{background:var(--plum);border-radius:12px;padding:24px 20px;text-align:center;margin-top:30px}
.cta h3{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--white);margin:0 0 8px;line-height:1.25}
.cta p{font-size:15px;color:var(--violet);margin:0 0 18px;line-height:1.6}
.cta-btn{display:block;width:100%;text-align:center;text-decoration:none;box-sizing:border-box;background:var(--white);color:var(--plum);border:none;border-radius:8px;padding:14px;font-family:var(--sans);font-size:17px;font-weight:600;cursor:pointer}
.cta-btn:hover{background:var(--lilac)}
.cta-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cta-note{font-size:14px;color:var(--violet);margin:12px 0 0;line-height:1.5}
.cta-copied{display:none;background:rgba(255,255,255,.12);border-radius:6px;padding:10px;font-size:14px;color:var(--white);margin-top:12px;line-height:1.5;text-align:left}

.more{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
.more a{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink);text-decoration:none;font-size:16px;padding:11px 0;border-bottom:1px solid var(--lilac)}
.more a:hover{color:var(--plum)}
.more a span:last-child{color:var(--orchid);font-size:18px}

footer{background:var(--ink);color:var(--lilac);padding:26px 20px;text-align:center;font-size:14px;margin-top:40px}
footer a{color:var(--violet);text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── Actions ────────────────────────────────────────────────────── */
function go(s){
  if (s === 'questions' && step === 'intro' && window.rxTrack) rxTrack('QuizStart', { lang: lang });
  step = s; render();
}

function pick(i, oi){
  ans[QS[i].id] = QS[i].opts[oi].s;
  if (i < QS.length - 1) { qi++; } else { step = 'sens'; }
  render();
}
function pickSens(v){ sens = v; step = 'concerns'; render(); }

function toggle(v){
  var i = concerns.indexOf(v);
  if (i > -1) concerns.splice(i, 1);
  else if (concerns.length < 3) concerns.push(v);
  render();
}

function finish(){
  var sc = [0,0,0,0], keys = ['oily','dry','combination','normal'];
  Object.keys(ans).forEach(function(k){
    for (var i = 0; i < 4; i++) sc[i] += ans[k][i];
  });
  var max = Math.max.apply(null, sc);
  // Tiebreak: combination > oily > dry > normal.
  // Combination first because mixed signals most often mean mixed skin.
  var order = [2,0,1,3], win = 3;
  for (var j = 0; j < order.length; j++) { if (sc[order[j]] === max) { win = order[j]; break; } }
  var type = keys[win];

  var raw = sens == null ? 0 : sens;
  var lvl = raw <= 1 ? 0 : (raw <= 3 ? 1 : 2);

  // Protocol: base stack, swapped for sensitivity, plus one concern-led addition
  var plan = BASE[type].slice();
  if (lvl === 2) plan = plan.map(function(k){ return SENS_SWAP[k] || k; });
  concerns.forEach(function(c){
    var add = CONC_ADD[c];
    if (add && plan.indexOf(add) === -1 && plan.length < 5) plan.push(add);
  });

  // Chips mirror the MOS KELADI product tags
  var chips = [];
  if (lvl === 2) chips.push(lang === 'ru' ? 'Чувствительная' : 'Sezgir');
  if (type === 'dry' || concerns.indexOf('dryness') > -1) chips.push(lang === 'ru' ? 'Обезвоженная' : 'Suvsizlangan');
  if (concerns.indexOf('pigment') > -1) chips.push(lang === 'ru' ? 'Неровный тон' : 'Notekis ton');
  if (concerns.indexOf('acne') > -1) chips.push(lang === 'ru' ? 'Склонная к высыпаниям' : 'Toshmaga moyil');
  if (concerns.indexOf('redness') > -1) chips.push(lang === 'ru' ? 'Склонная к покраснению' : 'Qizarishga moyil');

  out = { type:type, sensRaw:raw, sensLevel:lvl, concerns:concerns.slice(), plan:plan, chips:chips };
  step = 'results';
  writeUrl();
  if (window.rxTrack) rxTrack('QuizComplete', { skin_type: type, sensitivity: lvl, concerns: concerns.join(',') || 'none', lang: lang });
  render();
}

function reset(){
  step = 'intro'; qi = 0; ans = {}; sens = null; concerns = []; out = null;
  history.replaceState(null, '', location.pathname);
  render();
}

/* ── Shareable result URL ───────────────────────────────────────
   ?r=combination-2-acne.dull  — readable, and the same string can
   become a real path (/uz/teri/aralash-sezgir/) once the site has
   server-side routing. Until then this keeps results linkable. */
function writeUrl(){
  var s = out.type + '-' + out.sensLevel + (out.concerns.length ? '-' + out.concerns.join('.') : '');
  history.replaceState(null, '', location.pathname + '?r=' + s);
}
function readUrl(){
  var m = /[?&]r=([^&]+)/.exec(location.search);
  if (!m) return false;
  var p = decodeURIComponent(m[1]).split('-');
  if (!TYPES[p[0]]) return false;
  var lvl = Math.min(2, Math.max(0, parseInt(p[1], 10) || 0));
  concerns = p[2] ? p[2].split('.').filter(function(c){ return CONC_ADD[c]; }).slice(0, 3) : [];
  sens = lvl === 0 ? 0 : (lvl === 1 ? 2 : 5);
  var plan = BASE[p[0]].slice();
  if (lvl === 2) plan = plan.map(function(k){ return SENS_SWAP[k] || k; });
  concerns.forEach(function(c){
    var a = CONC_ADD[c];
    if (a && plan.indexOf(a) === -1 && plan.length < 5) plan.push(a);
  });
  out = { type:p[0], sensRaw:sens, sensLevel:lvl, concerns:concerns.slice(), plan:plan, chips:[] };
  step = 'results';
  return true;
}

/* ── Telegram handoff ───────────────────────────────────────────
   t.me/<username>?text=… opens the chat with the result already typed in
   the message box (current Telegram apps, core.telegram.org/api/links).
   The visitor only presses Send — a message can never be sent without
   that tap. The text is also copied as a fallback for old app versions. */
var TG_USER = 'rhodexuz';
function tgLink(){
  return 'https://t.me/' + TG_USER + '?text=' + encodeURIComponent(resultText());
}
function resultText(){
  var ty = TYPES[out.type], sl = SENSTXT[out.sensLevel];
  var L = lang === 'ru'
    ? {h:'Результат теста кожи Rhodex', ty:'Тип кожи', se:'Чувствительность', co:'Беспокоит', no:'не выбрано',
       ask:'Хочу разобрать результат и подобрать уход.'}
    : {h:'Rhodex teri testi natijasi', ty:'Teri tipi', se:'Sezgirlik', co:'Muammolar', no:'tanlanmagan',
       ask:'Natijani koʻrib chiqib, menga mos parvarishni tanlashda yordam bering.'};
  var cl = out.concerns.length
    ? out.concerns.map(function(v){
        var c = CONC.filter(function(x){ return x.v === v; })[0];
        return c ? '• ' + c[lang] : '';
      }).filter(Boolean).join('\n')
    : L.no;
  var link = 'https://rhodex.uz' + location.pathname.replace(/^.*\/(uz|ru)\//, '/$1/') + location.search;
  return L.h + '\n\n' + L.ty + ': ' + ty[lang] + '\n' + L.se + ': ' + sl[lang]
       + '\n\n' + L.co + ':\n' + cl + '\n\n' + L.ask + '\n\n' + link;
}

function copyText(s){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
  return new Promise(function(res, rej){
    var a = document.createElement('textarea');
    a.value = s; a.setAttribute('readonly',''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); }
    document.body.removeChild(a);
  });
}

function toSpecialist(){
  // The link itself opens Telegram (a real <a>, so mobile browsers never block it).
  copyText(resultText()).catch(function(){});
  var n = document.getElementById('copied');
  if (n) n.style.display = 'block';
}

  redness:['redness-prone'], dull:['dull','uneven-tone'], wrinkles:['wrinkles','loss-of-firmness','mature']
};
var TYPE_MAP = { oily:['blemish-prone','congested'], combination:['congested'], dry:['dehydrated'], normal:[] };
function matchResults(){
  if (typeof resultsForConcerns !== 'function' || !out) return [];
  var want = [];
  out.concerns.forEach(function(c){ (RES_MAP[c] || []).forEach(function(x){ if (want.indexOf(x) < 0) want.push(x); }); });
  (TYPE_MAP[out.type] || []).forEach(function(x){ if (want.indexOf(x) < 0) want.push(x); });
  if (!want.length) return [];
  return resultsForConcerns(want).slice(0, 2);
}

/* ── Boot ───────────────────────────────────────────────────────── */
(function init(){
  document.documentElement.lang = lang;
/* Carry ?p= / ?cat= / ?tag= / ?r= across the language switch, so a filtered
   grid or a quiz result stays intact when the visitor changes language. */
document.querySelectorAll('[data-swap]').forEach(function(a){
  a.href = a.getAttribute('href') + location.search;
});
try { localStorage.setItem('rhodex-lang', document.documentElement.lang); } catch(e){}
  readUrl();
  render();
})();
</script>
