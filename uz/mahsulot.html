<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahsulot — Rhodex Uzbekistan</title>
<style>
:root{
  --plum:#5b4170; --lilac:#efe9f4; --orchid:#c8a2c8; --cream:#f8f5ef;
  --ink:#33293c; --ink-soft:#6a6072; --gold:#b89b6a; --violet:#e2cbf6;
  --rule:#d8cce2; --white:#fff;
  --sans:'Jost',-apple-system,'Segoe UI',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}

.top{background:var(--plum);color:var(--white);padding:16px 20px}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-size:15px;letter-spacing:3px;text-transform:uppercase;font-weight:500;color:var(--white);text-decoration:none}
.nav{display:flex;gap:20px}
.nav a{color:var(--violet);text-decoration:none;font-size:15px}
.nav a:hover{color:var(--white)}
.lang{display:flex;gap:2px}
.lang a{display:inline-block;text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.75);font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:1px;padding:4px 9px;cursor:pointer;border-radius:3px}
.lang a.on{background:var(--white);color:var(--plum);border-color:var(--white)}
@media(max-width:640px){.nav a{display:none}}

.crumb{max-width:960px;margin:0 auto;padding:16px 20px 0;font-size:14px;color:var(--ink-soft)}
.crumb a{color:var(--plum);text-decoration:none}
.crumb a:hover{text-decoration:underline}

.wrap{max-width:960px;margin:0 auto;padding:20px 20px 60px}
.head{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
@media(max-width:760px){.head{grid-template-columns:1fr;gap:24px}}

.shot{background:var(--white);border:1px solid var(--rule);border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:contain;padding:32px}
.shot .ph{font-family:var(--serif);font-size:64px;color:var(--orchid)}

.tab{display:inline-block;background:var(--plum);color:var(--white);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;font-weight:500;padding:6px 13px;border-radius:3px}
.tabcat{display:inline-block;font-size:15px;color:var(--ink-soft);margin-left:10px}
h1{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--plum);margin:16px 0 4px;line-height:1.05}
.vol{font-size:17px;color:var(--ink-soft);margin:0 0 16px}
.band{background:var(--lilac);border-left:3px solid var(--plum);border-radius:0 8px 8px 0;padding:13px 16px;font-family:var(--serif);font-size:20.5px;color:var(--plum);margin:0 0 16px;line-height:1.3}
.kfda{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:11px 0;margin:0 0 18px}
.kfda p{margin:0;font-size:16px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-row{margin-bottom:14px}
.chip-lbl{display:block;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px}
.chip{border:1px solid var(--plum);color:var(--plum);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.chip:hover{background:var(--lilac)}
.chip.safe{border-color:var(--gold);color:var(--gold);background:rgba(184,155,106,.08)}

.sec{margin-top:44px}
.sec-h{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--plum);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--gold);margin-bottom:18px}
.bens{list-style:none;padding:0;margin:0}
.bens li{position:relative;padding:0 0 0 22px;margin-bottom:13px;font-size:17px;color:var(--ink);line-height:1.6}
.bens li::before{content:'';position:absolute;left:0;top:11px;width:10px;height:1px;background:var(--gold)}
.prose{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:18px;font-size:17px;color:var(--ink-soft);line-height:1.7}
.inci{font-size:15px;color:var(--ink-soft);line-height:1.75;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:18px}

.cta{background:var(--plum);border-radius:14px;padding:28px 24px;text-align:center;margin-top:44px}
.cta h3{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--white);margin:0 0 8px;line-height:1.2}
.cta p{font-size:16px;color:var(--violet);margin:0 0 20px;line-height:1.6}
.cta a{display:inline-block;background:var(--white);color:var(--plum);border-radius:8px;padding:14px 34px;font-size:17px;font-weight:600;text-decoration:none}
.cta a:hover{background:var(--lilac)}

.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.res-c{display:block;background:var(--white);border:1px solid var(--rule);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit}
.res-c:hover{border-color:var(--orchid)}
.res-c img{width:100%;display:block}
.res-m{font-size:15px;color:var(--ink-soft);margin:0;padding:12px 14px;line-height:1.5}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.rc{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:14px;text-decoration:none;color:inherit}
.rc:hover{border-color:var(--orchid)}
.rc .n{font-size:17px;font-weight:600;color:var(--plum);margin:0 0 3px}
.rc .s{font-size:14px;color:var(--ink-soft);margin:0}

.miss{max-width:640px;margin:60px auto;text-align:center;color:var(--ink-soft)}
footer{background:var(--ink);color:var(--lilac);padding:30px 20px;text-align:center;font-size:14px}
footer a{color:var(--violet);text-decoration:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="../css/site.css">
<link rel="canonical" href="https://rhodex.uz/uz/mahsulot.html">
<link rel="alternate" hreflang="uz" href="https://rhodex.uz/uz/mahsulot.html">
<link rel="alternate" hreflang="ru" href="https://rhodex.uz/ru/produkt.html">
<link rel="alternate" hreflang="x-default" href="https://rhodex.uz/uz/mahsulot.html">
<script src="../js/track.js"></script>
</head>
<body>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1873816187313952&amp;ev=PageView&amp;noscript=1"></noscript>

<header class="top">
  <div class="top-in">
    <a href="mahsulotlar.html" class="logo">Rhodex</a>
    <nav class="nav">
      <a href="mahsulotlar.html" data-nav="prods">Mahsulotlar</a>
      <a href="teri-testi.html" data-nav="quiz">Teri testi</a>
      <a href="../education/uz/index.html" data-nav="edu">Bilim</a>
      <a href="natijalar.html" data-nav="res">Natijalar</a>
    </nav>
    <div class="lang"><a href="mahsulot.html" class="on" hreflang="uz">UZ</a><a href="../ru/produkt.html" data-swap hreflang="ru">РУ</a></div>
  </div>
</header>

<div class="crumb" id="crumb"></div>
<main class="wrap" id="main"></main>

<footer>
  <p style="margin:0 0 8px"><a href="https://t.me/rhodexuz">t.me/rhodexuz</a> &nbsp;·&nbsp; +998 90 356 01 00</p>
  <p style="margin:0;opacity:.6">&copy; 2026 Rhodex Uzbekistan</p>
  <p style="margin:6px 0 0;opacity:.5;font-size:12.5px">Sayt tahlil maqsadida cookie-fayllardan foydalanadi (Meta, Yandex).</p>
</footer>

<script src="../data/products.js"></script>
<script src="../data/results.js"></script>
<script>

const lang = 'uz';
const slug = new URLSearchParams(location.search).get('p');
const RES_PAGE = 'natijalar.html';
const GRID = 'mahsulotlar.html';

const T = {
  uz:{ home:"Bosh sahifa", prods:"Mahsulotlar", bens:"Foydali xususiyatlari",
       how:"Qoʻllash tartibi", inci:"Asosiy tarkibiy qismlar", prodRes:"Bu mahsulot bilan natijalar", mon:"oy", suits:"Kimga mos", helps:"Nimaga yordam beradi",
       ctaT:"Bu mahsulot sizga mos keladimi?",
       ctaD:"Mutaxassis teringizni koʻrib, sizga mos parvarish tartibini tuzadi.",
       ctaB:"Telegramda soʻrash", rel:"Shu toifadagi boshqa mahsulotlar",
       miss:"Mahsulot topilmadi.", back:"Barcha mahsulotlarni koʻrish" },
  ru:{ home:"Главная", prods:"Продукты", bens:"Полезные свойства",
       how:"Способ применения", inci:"Основные компоненты", suits:"Кому подходит", helps:"С чем помогает",
       ctaT:"Подходит ли вам этот продукт?",
       ctaD:"Специалист посмотрит вашу кожу и составит подходящий уход.",
       ctaB:"Спросить в Telegram", rel:"Другие продукты этой категории",
       miss:"Продукт не найден.", back:"Смотреть все продукты" }
};
const t = k => T[lang][k] || k;
const L = o => (o && o[lang]) || (o && o.uz) || '';

function draw(){
  const p = bySlug(slug);

  if (!p || !p.published){
    document.getElementById('crumb').innerHTML = '';
    document.getElementById('main').innerHTML =
      `<div class="miss"><p>${t('miss')}</p><a class="chip" href="mahsulotlar.html">${t('back')}</a></div>`;
    return;
  }
  if (!window.__rxVC && window.rxTrack) { window.__rxVC = 1; rxTrack('ViewContent', { content_ids:[p.slug], content_type:'product', content_name:p.name }); }

  const cat = CATEGORIES.find(c => c.id === p.category);
  document.title = `${p.name} — Rhodex Uzbekistan`;
  document.getElementById('crumb').innerHTML =
    `<a href="mahsulotlar.html">${t('prods')}</a>
     &rsaquo; <a href="mahsulotlar.html?cat=${p.category}">${L(cat)}</a> &rsaquo; ${p.name}`;

  /* KFDA gold line renders only from the confirmed actives array.
     An empty array renders nothing — never a placeholder, never inferred. */
  const kfdaLine = p.kfda.length
    ? `<div class="kfda"><p>&#9733; KFDA &middot; ${p.kfda.map(k => L(KFDA[k])).join(' + ')}</p></div>`
    : '';

  /* Chips link back into the filtered grid, so the taxonomy navigates in
     both directions. Two rows, because "what my skin is" and "what my skin
     needs" are different questions — a flat list blurs them. */
  const chipRow = (label, ids, vocab, param) => ids.length ? `
    <div class="chip-row"><span class="chip-lbl">${label}</span><div class="chips">` +
    ids.map(k => `<a class="chip" href="${GRID}?${param}=${k}">${L(vocab[k])}</a>`).join('') +
    `</div></div>` : '';

  const chips = chipRow(t('suits'), p.skinTypes, SKIN_TYPES, 'type')
              + chipRow(t('helps'), p.concerns, CONCERNS, 'concern')
              + (p.pregnancySafe
                  ? `<div class="chip-row"><div class="chips"><span class="chip safe">${L(PREGNANCY_SAFE_LABEL)}</span></div></div>`
                  : '');

  /* Results achieved with this exact product — the strongest proof a
     product page can carry, and it costs nothing extra to surface. */
  const rs = (typeof resultsForProduct === 'function') ? resultsForProduct(p.slug) : [];
  const resBlock = rs.length ? `
    <section class="sec"><div class="sec-h">${t('prodRes')}</div>
    <div class="res-grid">` + rs.slice(0,2).map(r => `
      <a class="res-c" href="${RES_PAGE}">
        <img src="${r.image}" alt="" loading="lazy">
        <p class="res-m"><b>${durationLabel(r, lang)}</b> &middot; ${(r.note&&r.note[lang])||''}</p>
      </a>`).join('') + `</div></section>` : '';

  const rel = live().filter(x => x.category === p.category && x.slug !== p.slug).slice(0, 3);
  const relBlock = rel.length ? `
    <section class="sec"><div class="sec-h">${t('rel')}</div><div class="rel">` +
    rel.map(x => `<a class="rc" href="mahsulot.html?p=${x.slug}">
      <p class="n">${x.name}</p><p class="s">${L(x.subtitle)} &middot; ${x.volume}</p></a>`).join('') +
    `</div></section>` : '';

  document.getElementById('main').innerHTML = `
    <div class="head">
      <div class="shot"><img src="${p.image}" alt="${p.name}"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'R'}))"></div>
      <div>
        <span class="tab">${p.brand}</span><span class="tabcat">${cat.en}</span>
        <h1>${p.name}</h1>
        <p class="vol">${p.volume}${p.spf ? ' &middot; ' + p.spf : ''} &middot; ${L(p.subtitle)}</p>
        <p class="band">${L(p.band)}</p>
        ${kfdaLine}
        <div class="chips">${chips}</div>
      </div>
    </div>

    <section class="sec"><div class="sec-h">${t('bens')}</div>
      <ul class="bens">${L(p.benefits).map(b => `<li>${b}</li>`).join('')}</ul></section>

    <section class="sec"><div class="sec-h">${t('how')}</div>
      <p class="prose" style="margin:0">${L(p.howto)}</p></section>

    <section class="sec"><div class="sec-h">${t('inci')}</div>
      <p class="inci" style="margin:0">${L(p.inci)}</p></section>

    <section class="cta">
      <h3>${t('ctaT')}</h3><p>${t('ctaD')}</p>
      <a href="https://t.me/rhodexuz" target="_blank" rel="noopener">${t('ctaB')}</a>
    </section>

    ${resBlock}
    ${relBlock}`;
}






/* Carry ?p= / ?cat= / ?tag= / ?r= across the language switch, so a filtered
   grid or a quiz result stays intact when the visitor changes language. */
document.querySelectorAll('[data-swap]').forEach(function(a){
  a.href = a.getAttribute('href') + location.search;
});
try { localStorage.setItem('rhodex-lang', document.documentElement.lang); } catch(e){}
draw();
</script>
</body>
</html>
